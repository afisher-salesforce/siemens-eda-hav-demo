<template>
    <lightning-card title={cardTitle} icon-name="standard:calendar">
        <div slot="actions" class="hm-actions">
            <lightning-combobox
                class="hm-focus slds-m-right_x-small"
                label="Region"
                variant="label-hidden"
                placeholder="All regions"
                options={regionOptions}
                value={region}
                onchange={handleRegion}
            ></lightning-combobox>
            <lightning-combobox
                class="hm-focus slds-m-right_small"
                label="Focus on customer"
                variant="label-hidden"
                placeholder="All customers"
                options={customerOptions}
                value={focusId}
                onchange={handleFocus}
            ></lightning-combobox>
            <template for:each={windowOptions} for:item="w">
                <lightning-button
                    key={w.key}
                    label={w.label}
                    variant={w.variant}
                    data-value={w.value}
                    onclick={handleWindow}
                    class="slds-m-left_xx-small"
                ></lightning-button>
            </template>
            <lightning-button
                label="New reservation"
                icon-name="utility:add"
                variant="brand"
                data-fromday="false"
                onclick={handleReserve}
                class="slds-m-left_small"
            ></lightning-button>
            <lightning-button-icon
                icon-name="utility:refresh"
                alternative-text="Refresh"
                onclick={handleRefresh}
                class="slds-m-left_x-small"
            ></lightning-button-icon>
        </div>

        <div class="slds-p-horizontal_medium">
            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                Blade-slot capacity by day across colo → row → tower → blade, computed live from allocations,
                reservations and pipeline demand. Capacity and power both gate whether a job can run.
            </p>

            <template lwc:if={error}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                    Could not load capacity: {error}
                </div>
            </template>

            <!-- Expansion banner -->
            <template lwc:if={hasAlerts}>
                <div class="hm-banner slds-m-bottom_small">
                    <div class="hm-banner-title">
                        <lightning-icon icon-name="utility:warning" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        Pipeline-informed expansion forecast
                    </div>
                    <template for:each={alerts} for:item="a">
                        <p key={a.key} class="slds-text-body_regular">{a.text}</p>
                    </template>
                </div>
            </template>

            <!-- Breadcrumb -->
            <div class="hm-crumbs slds-m-bottom_small">
                <template for:each={crumbs} for:item="c">
                    <span key={c.key} class="hm-crumb">
                        <template lwc:if={c.showSep}>
                            <lightning-icon icon-name="utility:chevronright" size="xx-small" class="slds-m-horizontal_xx-small"></lightning-icon>
                        </template>
                        <template lwc:if={c.isLast}>
                            <strong>{c.label}</strong>
                        </template>
                        <template lwc:else>
                            <a data-index={c.index} onclick={handleCrumb}>{c.label}</a>
                        </template>
                    </span>
                </template>
                <span class="hm-level slds-m-left_small">{levelLabel}</span>
            </div>

            <template lwc:if={hasGrid}>
                <!-- Metrics -->
                <div class="hm-metrics slds-m-bottom_medium">
                    <template for:each={metrics} for:item="m">
                        <div key={m.key} class="hm-metric">
                            <div class="hm-metric-label">{m.label}</div>
                            <div class="hm-metric-value">{m.value}</div>
                            <div class={m.subClass}>{m.sub}</div>
                        </div>
                    </template>
                </div>

                <!-- Heatmap -->
                <div class="hm-heading">{gridHeading}</div>
                <div class="hm-scroll">
                    <div class="hm-inner">
                        <div class="hm-row hm-ticks">
                            <div class="hm-label"></div>
                            <template for:each={ticks} for:item="t">
                                <div key={t.key} class="hm-tick"><span>{t.label}</span></div>
                            </template>
                        </div>
                        <template for:each={rows} for:item="r">
                            <div key={r.key} class={r.rowClass}>
                                <div class={r.labelClass} data-key={r.nodeKey} onclick={handleDrill} title={r.label}>
                                    <lightning-icon icon-name={r.icon} size="xx-small" class="slds-m-right_x-small"></lightning-icon>
                                    <span class="slds-truncate">{r.label}</span>
                                </div>
                                <template for:each={r.cells} for:item="c">
                                    <div key={c.key} class={c.cls} style={c.style} title={c.title}
                                        data-node={r.nodeKey} data-day={c.day} onclick={handleCellClick}></div>
                                </template>
                                <div class="hm-badges">
                                    <template lwc:if={r.showBadge}>
                                        <span class={r.badgeClass}>{r.badge}</span>
                                    </template>
                                    <template lwc:if={r.showConflict}>
                                        <span class="slds-badge hm-badge-short">{r.conflict}</span>
                                    </template>
                                    <template lwc:if={r.showRegion}>
                                        <span class="slds-badge hm-badge-region">{r.regionLabel}</span>
                                    </template>
                                    <template lwc:if={r.showFocus}>
                                        <span class="slds-badge hm-badge-focus">{r.focusBadge}</span>
                                    </template>
                                </div>
                            </div>
                        </template>
                        <template lwc:if={hasPower}>
                            <div class="hm-row hm-power">
                                <div class="hm-label">
                                    <lightning-icon icon-name="utility:bolt" size="xx-small" class="slds-m-right_x-small"></lightning-icon>
                                    <span>Power headroom</span>
                                </div>
                                <template for:each={powerCells} for:item="p">
                                    <div key={p.key} class="hm-cell hm-cell-power" style={p.style} title={p.title}></div>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Legend -->
                <div class="hm-legend slds-m-top_small">
                    <span><i style="background-color:#99f6e4"></i>&lt;30% used</span>
                    <span><i style="background-color:#14b8a6"></i>30–60%</span>
                    <span><i style="background-color:#0d9488"></i>60–85%</span>
                    <span><i style="background-color:#f59e0b"></i>85%+ / blade reserved</span>
                    <span><i style="background-color:#009999"></i>Blade in use</span>
                    <span><i style="background-color:#dc2626"></i>Full</span>
                    <span><i style="background-color:#ef4444"></i>Tower conflict</span>
                    <span><i class="hm-legend-conflict"></i>Conflict in a tower below</span>
                    <span><i class="hm-legend-short"></i>Short vs pipeline</span>
                    <span class="slds-text-color_weak">Hover a cell for that day; click a cell for its detail and actions. Click a row name to drill down.</span>
                </div>
                <template lwc:if={hasFocus}>
                    <p class="hm-focus-note slds-m-top_x-small">{focusNote}</p>
                </template>


                <!-- Day detail: click any cell -->
                <template lwc:if={hasDetail}>
                    <div class="hm-detail slds-m-top_medium">
                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                            <div class="hm-detail-title">
                                <lightning-icon icon-name="utility:event" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                {detail.title}
                            </div>
                            <div>
                                <lightning-button label="Reserve capacity here" icon-name="utility:add" data-fromday="true"
                                    onclick={handleReserve} disabled={busy}></lightning-button>
                                <lightning-button-icon icon-name="utility:close" alternative-text="Close day detail"
                                    onclick={handleCloseDetail} class="slds-m-left_x-small"></lightning-button-icon>
                            </div>
                        </div>
                        <div class="hm-stats slds-m-bottom_small">
                            <template for:each={detail.stats} for:item="st">
                                <div key={st.key} class={st.cls2}>
                                    <div class="hm-metric-label">{st.label}</div>
                                    <div class="hm-stat-value">{st.value}</div>
                                </div>
                            </template>
                        </div>
                        <template lwc:if={hasDetailConflicts}>
                            <div class="hm-conflicts slds-m-bottom_small">
                                <div class="hm-banner-title">Conflicts this day</div>
                                <template for:each={detail.conflicts} for:item="cf">
                                    <p key={cf.key}>{cf.text}</p>
                                </template>
                                <p class="slds-text-body_small slds-text-color_weak">Use a hold's row menu to move it to a tower with room (in-use holds: plan a move), or release it.</p>
                            </div>
                        </template>
                        <template lwc:if={hasDetailHolds}>
                            <lightning-datatable key-field="id" data={detail.holds} columns={detailColumns}
                                hide-checkbox-column onrowaction={handleRowAction}></lightning-datatable>
                        </template>
                        <template lwc:else>
                            <p class="slds-text-color_weak">No holds on this day.</p>
                        </template>
                        <template lwc:if={moveFor}>
                            <div class="hm-move slds-m-top_small">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                    <strong>{moveTitle}</strong>
                                    <lightning-button variant="base" label="Cancel" onclick={handleCancelMove}></lightning-button>
                                </div>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-vertical_xx-small">{moveHint}</p>
                                <template lwc:if={isPlanMove}>
                                    <lightning-input type="date" label="Move date" value={moveDate} onchange={handleMoveDate}
                                        class="hm-move-date"></lightning-input>
                                </template>
                                <template lwc:if={moveLoading}>
                                    <p class="slds-text-color_weak">Checking every tower for the rest of this hold…</p>
                                </template>
                                <template lwc:elseif={hasMoveOptions}>
                                    <template for:each={moveOptions} for:item="o">
                                        <div key={o.key} class="hm-move-option">
                                            <div>
                                                <div>{o.label}</div>
                                                <div class="slds-text-body_small slds-text-color_weak">{o.detail}</div>
                                            </div>
                                            <lightning-button label={moveButtonLabel} variant="brand" data-tower={o.towerId}
                                                onclick={handleMoveHere} disabled={busy}></lightning-button>
                                        </div>
                                    </template>
                                </template>
                                <template lwc:else>
                                    <p class="slds-text-color_error">No other tower can hold this for the rest of its window. Release it, shorten it, or add capacity.</p>
                                </template>
                            </div>
                        </template>
                        <template lwc:if={detailLoading}>
                            <lightning-spinner alternative-text="Loading day" size="small"></lightning-spinner>
                        </template>
                    </div>
                </template>

                <!-- Holds on this row / tower -->
                <template lwc:if={showHoldsSection}>
                    <div class="hm-heading slds-m-top_medium">Holds in this window</div>
                    <template lwc:if={hasHolds}>
                        <lightning-datatable
                            key-field="id"
                            data={holds}
                            columns={holdColumns}
                            hide-checkbox-column
                        ></lightning-datatable>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-color_weak">No holds in this window.</p>
                    </template>
                </template>
            </template>

            <template lwc:if={loading}>
                <lightning-spinner alternative-text="Loading capacity" size="small"></lightning-spinner>
            </template>
        </div>
    </lightning-card>
</template>
